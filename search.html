<!doctype html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <meta name="theme-color" content="#10243e">
        <title>Search results | SHOPORA</title>
        <meta name="description" content="Search SHOPORA products.">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
                rel="stylesheet">
        <link rel="stylesheet" href="./styles.css?v=21">
        <link rel="icon" type="image/svg+xml" href="./favicon.svg">
</head>

<body data-page-type="search">
        <a class="skip-link" href="#mainContent">Skip to content</a>
        <div class="announcement"><span>Free delivery above $35</span><span>Easy 7-day returns</span><span>100% secure
                        payments</span></div>
        <header class="site-header">
                <div class="nav-shell"><a class="brand" href="./index.html"><span
                                        class="brand-mark">S</span><span>SHOPORA<small>smart shopping</small></span></a>
                        <form class="searchbar" id="searchForm" role="search"><select aria-label="Search category"
                                        id="headerCategory">
                                        <option value="all">All</option>
                                        <option value="electronics">Electronics</option>
                                        <option value="fashion">Fashion</option>
                                        <option value="home">Home</option>
                                        <option value="books">Books</option>
                                </select><input id="headerSearch" type="search"
                                        placeholder="Search for products, brands and more"
                                        aria-label="Search products"><button aria-label="Submit search">⌕</button>
                        </form>
                        <nav class="account-nav"><a href="./account.html" class="account-chip" data-identity-state="guest"><span class="greeting">Hello, guest</span><span class="account-label">Account</span></a><a href="./orders.html"><span>Returns</span><strong>&
                                                Orders</strong></a><a
                                        href="./category.html"><span>Your</span><strong>Wishlist <b
                                                        data-wishlist-count>0</b></strong></a><a class="cart-link"
                                        href="./cart.html"><span class="cart-glyph">🛒</span><strong
                                                data-cart-count>0</strong><b>Cart</b></a></nav>
                </div>
                <div class="dept-rail"><button class="mobile-menu-button" type="button">☰ All</button><a
                                href="./category.html?category=electronics">Mobiles & Electronics</a><a
                                href="./category.html?category=fashion">Fashion</a><a href="./category.html?category=home">Home & Kitchen</a><a
                                href="./category.html?category=books">Books</a><a href="./category.html?deal=true">Today's Deals</a><span
                                class="rail-offer">Shopora Plus: extra 5% off</span></div>
        </header>
        <main id="mainContent" class="catalog-shell">
                <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="./index.html">Home</a><span>›</span><span>Search
                                results</span></nav>
                <div class="catalog-heading">
                        <div><span class="section-kicker">SHOPORA SEARCH</span>
                                <h1 id="searchHeading">Showing results</h1>
                        </div>
                </div>
                <div class="catalog-layout">
                        <section class="catalog-results" style="grid-column:1 / -1;">
                                <div class="product-grid catalog-grid" id="searchGrid"></div>
                        </section>
                </div>
        </main>
        <template id="productCardTemplate">
                <article class="product-card">
                        <div class="product-image">
                                <div class="product-badge-row"><span class="discount-badge"></span><button
                                                class="wishlist-button" type="button"
                                                aria-label="Add to wishlist">♡</button></div>
                        </div>
                        <div class="product-body">
                                <p class="product-brand"></p>
                                <h3></h3>
                                <div class="rating-line"><span class="stars"></span><span class="rating-count"></span>
                                </div>
                                <p class="product-meta"></p>
                                <div class="price-stack"><strong></strong><del></del><span></span></div>
                                <p class="delivery-note">FREE delivery <b>Tomorrow</b></p>
                                <div class="card-actions"><button class="button quick-view" type="button">Quick
                                                view</button><button class="button button-primary add-to-cart"
                                                type="button">Add to cart</button></div>
                        </div>
                </article>
        </template>
        <div id="toastRegion" class="toast-region" aria-live="polite"></div>
        <div id="quickViewModal" class="modal" hidden></div>
        <script type="module" src="./app.js?v=38"></script>
        <script type="module" src="./demo_router.js?v=57"></script>
        <!-- AIORA JS Tag — coordination failure signal collector -->
        <script src="tag.js" data-client-id="shopora-prod" data-endpoint="/api/collect"
                data-sampling-rate="1.0" async></script>


</html>
